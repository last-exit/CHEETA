<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 64 96">
  <!-- A blind-embossed ogee trellis: no ink, only the press. A highlight above and a shade below each line. -->
  <defs>
    <path id="ogee" d="M0 0 C0 24 32 24 32 48 S0 72 0 96 M64 0 C64 24 32 24 32 48 S64 72 64 96" fill="none" stroke-width="1.6" stroke-linecap="round"/>
    <g id="bud">
      <path d="M0 -6 C3 -3 3 3 0 6 C-3 3 -3 -3 0 -6 Z"/>
      <circle r="1.3"/>
    </g>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0.45"/></filter>
  </defs>
  <g filter="url(#soft)">
    <g transform="translate(0.7 0.9)" stroke="#6b4e2a" stroke-opacity=".2" fill="#6b4e2a" fill-opacity=".14">
      <use href="#ogee"/>
      <use href="#bud" transform="translate(32 48)"/>
      <use href="#bud" transform="translate(0 0)"/>
      <use href="#bud" transform="translate(64 0)"/>
      <use href="#bud" transform="translate(0 96)"/>
      <use href="#bud" transform="translate(64 96)"/>
    </g>
    <g transform="translate(-0.6 -0.7)" stroke="#ffffff" stroke-opacity=".85" fill="#ffffff" fill-opacity=".7">
      <use href="#ogee"/>
      <use href="#bud" transform="translate(32 48)"/>
      <use href="#bud" transform="translate(0 0)"/>
      <use href="#bud" transform="translate(64 0)"/>
      <use href="#bud" transform="translate(0 96)"/>
      <use href="#bud" transform="translate(64 96)"/>
    </g>
  </g>
</svg>
